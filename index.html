<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3550">
<title>Backline móvil</title>
<style>
:root{
  --navy:#1F3550; --azul:#2E6FB5; --azulsuave:#E8F0FA;
  --fondo:#F2F4F7; --tarjeta:#FFFFFF; --texto:#101828; --suave:#667085; --linea:#D0D5DD;
  --verde:#067647; --verdesuave:#E7F6EE; --rojo:#B42318; --rojosuave:#FEE4E2; --ambar:#B54708; --ambarsuave:#FEF0C7;
  color-scheme:light;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --navy:#16212E; --azul:#5B9BE0; --azulsuave:#1B2B3D;
  --fondo:#0E141B; --tarjeta:#19212B; --texto:#E7ECF2; --suave:#8A97A6; --linea:#2C3845;
  --verde:#5FD39A; --verdesuave:#122A20; --rojo:#FF9A8F; --rojosuave:#2E1A18; --ambar:#F0B35B; --ambarsuave:#2E2414;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --navy:#16212E; --azul:#5B9BE0; --azulsuave:#1B2B3D;
  --fondo:#0E141B; --tarjeta:#19212B; --texto:#E7ECF2; --suave:#8A97A6; --linea:#2C3845;
  --verde:#5FD39A; --verdesuave:#122A20; --rojo:#FF9A8F; --rojosuave:#2E1A18; --ambar:#F0B35B; --ambarsuave:#2E2414;
  color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overscroll-behavior-y:contain}

/* ---------- barra de arriba ---------- */
header{background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) max(14px,var(--sar)) 10px max(14px,var(--sal));
  display:flex;align-items:center;gap:10px;flex:0 0 auto;z-index:20}
header .marca{font-weight:700;letter-spacing:.2px}
header .marca span{font-weight:400;opacity:.7;font-size:13px;margin-left:5px}
header .sp{flex:1}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:8px 11px;font-size:15px;font-family:inherit}
header button:active{background:rgba(255,255,255,.3)}
header .quien{font-size:13px;opacity:.85;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- cuerpo ---------- */
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px max(14px,var(--sar)) 22px max(14px,var(--sal))}
.vista{display:none}
.vista.on{display:block}

/* ---------- formularios ---------- */
#login{max-width:380px;margin:6vh auto 0}
#login h1{font-size:23px;margin:0 0 4px}
#login p.in{color:var(--suave);font-size:14.5px;margin:0 0 20px}
label{display:block;font-size:13px;color:var(--suave);margin:0 0 5px;font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],input[inputmode]{
  width:100%;padding:12px 11px;border:1.5px solid var(--linea);border-radius:11px;
  background:var(--tarjeta);color:var(--texto);font:16px/1.2 inherit;font-family:inherit;margin-bottom:12px;min-width:0}
input:focus{outline:2.5px solid var(--azul);outline-offset:-1px;border-color:var(--azul)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila2 > div{min-width:0}
.btn{width:100%;padding:14px;border:0;border-radius:11px;background:var(--azul);color:#fff;
  font:600 16px/1.2 inherit;font-family:inherit}
.btn:active{filter:brightness(.9)}
.btn[disabled]{opacity:.55}
.btn.sec{background:var(--tarjeta);color:var(--texto);border:1.5px solid var(--linea)}
.btn.ok{background:var(--verde)}
.btn.chico{width:auto;padding:9px 13px;font-size:14.5px;border-radius:10px}
.aviso{background:var(--rojosuave);color:var(--rojo);border-radius:10px;padding:11px 12px;font-size:14.5px;margin-bottom:14px}
.aviso:empty{display:none}
.info{background:var(--azulsuave);color:var(--texto);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.hint{color:var(--suave);font-size:13.5px}

/* ---------- listas ---------- */
.dia{margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--suave);
  display:flex;align-items:baseline;gap:8px}
.dia:first-child{margin-top:2px}
.dia b{color:var(--texto);font-size:15px;text-transform:none;letter-spacing:0}
.dia.hoy b{color:var(--azul)}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:13px;padding:12px 13px;margin-bottom:9px;
  display:block;width:100%;text-align:left;font:inherit;color:inherit}
button.card:active{background:var(--azulsuave)}
.card .t{font-weight:650;font-size:16px;line-height:1.25}
.card .m{color:var(--suave);font-size:13.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .m b{color:var(--texto);font-weight:600}
.card.fino{padding:9px 13px;background:transparent;border-style:dashed}
.card.fino .t{font-weight:500;font-size:14.5px;color:var(--suave)}
.card .sigue{font-size:12px;color:var(--suave);font-weight:600}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2.5px 8px;border-radius:99px;letter-spacing:.2px;vertical-align:1px;white-space:nowrap}
.pill.conf,.pill.si{background:var(--verdesuave);color:var(--verde)}
.pill.pend,.pill.poco{background:var(--ambarsuave);color:var(--ambar)}
.pill.anul{background:var(--rojosuave);color:var(--rojo);text-decoration:line-through}
.pill.no{background:var(--rojosuave);color:var(--rojo)}
.pill.ent,.pill.nd{background:var(--azulsuave);color:var(--azul)}
.vacio{color:var(--suave);text-align:center;padding:34px 16px;font-size:15px;line-height:1.5}
.cargando{color:var(--suave);text-align:center;padding:30px;font-size:15px}

/* disponible */
.res{display:flex;align-items:center;gap:10px}
.res .izq{flex:1;min-width:0}
.res .der{flex:0 0 auto;text-align:right}
.res .n{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}
.res .n small{font-size:12px;font-weight:600;color:var(--suave);display:block;margin-top:3px}
.n.si{color:var(--verde)} .n.poco{color:var(--ambar)} .n.no{color:var(--rojo)} .n.nd{color:var(--suave)}

/* presupuesto */
.bloque{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:13px 13px 2px;margin-bottom:12px}
.bloque > h3{margin:0 0 10px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:8px}
.bloque > h3 .sp{flex:1}
.bloque > h3 .sub{font-size:14px;color:var(--texto);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.sug{margin:-6px 0 12px;border:1px solid var(--linea);border-radius:11px;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;background:var(--tarjeta);border:0;border-bottom:1px solid var(--linea);padding:11px 12px;font:inherit;color:inherit}
.sug button:last-child{border-bottom:0}
.sug button small{color:var(--suave);display:block;font-size:13px}
.elegido{display:flex;align-items:center;gap:10px;background:var(--azulsuave);border-radius:11px;padding:10px 12px;margin-bottom:12px}
.elegido .izq{flex:1;min-width:0}
.elegido b{display:block}
.elegido small{color:var(--suave)}
.x{background:none;border:0;color:var(--suave);font-size:22px;line-height:1;padding:4px 6px}
.lin{border-top:1px solid var(--linea);padding:10px 0 10px}
.lin:first-of-type{border-top:0;padding-top:2px}
.lin .cab{display:flex;gap:8px;align-items:flex-start}
.lin .cab input{margin:0;padding:9px 10px;font-size:15px}
.lin .nums{display:grid;grid-template-columns:1.25fr .8fr .8fr 1.25fr;gap:7px;margin-top:7px;align-items:end}
.lin .nums label{font-size:11.5px;margin-bottom:3px}
.lin .nums input{margin:0;padding:9px 8px;font-size:15px;text-align:right}
.lin .imp{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;padding-bottom:9px;font-size:15px}
.lin .st{margin-top:6px}
.mas{display:flex;gap:8px;padding:6px 0 12px;flex-wrap:wrap}
.totales{background:var(--navy);color:#fff;border-radius:14px;padding:13px 14px;margin-bottom:12px}
.totales .r{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:3px 0;font-size:15px}
.totales .r.g{font-size:20px;font-weight:750;border-top:1px solid rgba(255,255,255,.25);margin-top:5px;padding-top:8px}
.totales small{opacity:.75;font-size:12.5px}
.hecho{text-align:center;padding:26px 8px 10px}
.hecho .ok{font-size:44px;line-height:1}
.hecho h2{margin:10px 0 4px;font-size:22px}
.hecho .ref{font-size:28px;font-weight:800;letter-spacing:.5px;color:var(--azul);margin:6px 0 4px}

/* cobros */
.tots{display:flex;gap:9px;margin-bottom:14px}
.tot{flex:1;background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:10px 11px;min-width:0}
.tot .e{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--suave)}
.tot .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.filtros{display:flex;gap:7px;margin-bottom:14px}
.filtros button{flex:1;padding:9px 6px;border:1.5px solid var(--linea);background:var(--tarjeta);color:var(--texto);
  border-radius:10px;font:600 14px/1.2 inherit;font-family:inherit}
.filtros button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.imp{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- panel de abajo ---------- */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
.velo[hidden]{display:none}
.hoja{background:var(--tarjeta);width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,var(--sar)) calc(18px + var(--sab)) max(16px,var(--sal));
  animation:sube .18s ease-out}
.hoja.alta{height:90vh;display:flex;flex-direction:column}
.hoja.alta .lista{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px}
@keyframes sube{from{transform:translateY(22px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){ .hoja{animation:none} }
.hoja h2{margin:2px 0 3px;font-size:19px;line-height:1.25}
.hoja .sub{color:var(--suave);font-size:14px;margin-bottom:14px}
.hoja .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hoja .top h2{flex:1;margin:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:15px;margin-bottom:16px}
.dl dt{color:var(--suave);font-size:13.5px}
.dl dd{margin:0;overflow-wrap:anywhere}
.acciones{display:flex;flex-direction:column;gap:9px}
.nota{background:var(--ambarsuave);color:var(--ambar);border-radius:10px;padding:10px 11px;font-size:14px;margin-bottom:12px}

/* ---------- pestañas de abajo ---------- */
nav{flex:0 0 auto;display:flex;background:var(--tarjeta);border-top:1px solid var(--linea);
  padding:0 max(0px,var(--sar)) var(--sab) max(0px,var(--sal))}
nav button{flex:1;background:none;border:0;padding:9px 2px 10px;color:var(--suave);font:600 11px/1.3 inherit;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav button.on{color:var(--azul)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav[hidden],header .sesion[hidden]{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab));background:var(--texto);color:var(--fondo);
  padding:10px 16px;border-radius:99px;font-size:14.5px;z-index:40;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
</style>
</head>
<body>

<header>
  <span class="marca">Backline<span>móvil</span></span>
  <span class="sp"></span>
  <span class="quien sesion" id="hQuien" hidden></span>
  <button class="sesion" id="bRecargar" hidden aria-label="Volver a leer del almacén">↻</button>
  <button class="sesion" id="bSalir" hidden>Salir</button>
</header>

<main>

  <!-- ENTRAR -->
  <section class="vista on" id="vLogin">
    <div id="login">
      <h1>Entra en el almacén</h1>
      <p class="in">Con el mismo usuario y la misma contraseña que en el ordenador.</p>
      <div class="aviso" id="loginAviso"></div>
      <form id="fLogin">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password" required>
        <button class="btn" type="submit" id="bEntrar">Entrar</button>
      </form>
    </div>
  </section>

  <!-- PRESUPUESTO RÁPIDO -->
  <section class="vista" id="vPresu">
    <div class="aviso" id="prAviso"></div>
    <div id="prCuerpo"><p class="cargando">Leyendo inventario y clientes…</p></div>
  </section>

  <!-- ¿ESTÁ LIBRE? -->
  <section class="vista" id="vLibre">
    <div class="aviso" id="liAviso"></div>
    <div class="fila2">
      <div><label for="liDesde">Desde</label><input type="date" id="liDesde"></div>
      <div><label for="liHasta">Hasta</label><input type="date" id="liHasta"></div>
    </div>
    <label for="liBusca">Material</label>
    <input type="search" id="liBusca" placeholder="Ampli, Nord, bombo 22…" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
    <div id="liLista"><p class="vacio">Escribe qué buscas y te digo cuántos quedan libres esos días.</p></div>
  </section>

  <!-- SEMANA -->
  <section class="vista" id="vSemana">
    <div class="aviso" id="semAviso"></div>
    <div id="semLista"><p class="cargando">Leyendo el Planning…</p></div>
  </section>

  <!-- COBROS -->
  <section class="vista" id="vCobros">
    <div class="aviso" id="cobAviso"></div>
    <div class="tots">
      <div class="tot"><div class="e">Por cobrar</div><div class="v" id="totPend">—</div></div>
      <div class="tot"><div class="e">Cobrado sin liquidar</div><div class="v" id="totSin">—</div></div>
    </div>
    <div class="filtros" id="cobFiltros">
      <button data-f="pend" class="on">Por cobrar</button>
      <button data-f="cob">Cobrados</button>
    </div>
    <div id="cobLista"><p class="cargando">Leyendo el libro…</p></div>
  </section>

</main>

<nav hidden id="tabs">
  <button data-v="Presu" class="on">
    <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
    Presupuesto
  </button>
  <button data-v="Libre">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11l2 2 4-4"/></svg>
    ¿Está libre?
  </button>
  <button data-v="Semana">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
    Semana
  </button>
  <button data-v="Cobros">
    <svg viewBox="0 0 24 24"><path d="M3 7h18v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l2.5-3h13L21 7"/><path d="M9 13h6"/></svg>
    Cobros
  </button>
</nav>

<div class="velo" id="velo" hidden><div class="hoja" id="hoja"></div></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============================================================
   Backline móvil
   Habla con el mismo almacén que la app del ordenador y guarda
   los presupuestos igual que ella, para que sean «uno más».
   ============================================================ */
const URL_ALMACEN = 'https://script.google.com/macros/s/AKfycbzOGwVS5mhVEA4nUWi3USM1XsrC0KopKL1MjeIeEiBcH3k62Z2RBCRIzYEQ0FafaCB5Cw/exec';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const N0 = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const eur = n => N0(n).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
const eur0 = n => Math.round(N0(n)).toLocaleString('es-ES') + ' €';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const hasP = v => v !== '' && v != null && !isNaN(+v) && +v > 0;
let _uid = 0;
const uid = () => (++_uid).toString(36) + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,5);
const numTxt = v => (v === '' || v == null) ? '' : String(v).replace('.', ',');

/* lo que se guarda en este móvil (puede fallar en modo privado: entonces no se guarda y ya) */
const guarda = (k, v) => { try{ v == null ? localStorage.removeItem('bkm_'+k) : localStorage.setItem('bkm_'+k, v); }catch(e){} };
const lee = k => { try{ return localStorage.getItem('bkm_'+k); }catch(e){ return null; } };

let TOKEN = lee('token') || '', USUARIO = lee('usuario') || '';
const COLS = ['planning','libro','liquidaciones','inventario','clientes','ajustes','devoluciones'];
const DATOS = {}; COLS.forEach(c => DATOS[c] = {items:[], firma:'', listo:false});
let VISTA = 'Presu', FILTRO = 'pend';

function toast(t){ const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(e._t); e._t = setTimeout(() => e.hidden = true, 2600); }

/* ---------- hablar con el almacén ---------- */
async function api(accion, extra = {}, ms = 30000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  let r;
  try{
    r = await fetch(URL_ALMACEN, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({accion, token:TOKEN}, extra)),
      signal: ctl.signal, redirect:'follow'
    });
  }catch(e){
    clearTimeout(t);
    throw new Error(e.name === 'AbortError' ? 'El almacén tarda demasiado. ¿Tienes cobertura?' : 'Sin conexión con el almacén. Comprueba los datos o el wifi.');
  }
  clearTimeout(t);
  if(!r.ok) throw new Error('El almacén respondió con un error (' + r.status + ').');
  let j;
  try{ j = await r.json(); }catch(e){ throw new Error('El almacén devolvió algo que no entiendo.'); }
  if(j.error === 'sesion'){ salir(true); throw new Error('Tu sesión ha caducado. Entra otra vez.'); }
  if(j.error && j.error !== 'conflicto') throw new Error(({
    credenciales:'Usuario o contraseña incorrectos.', peticion:'El almacén no entendió la petición.', mes:'Mes no válido para el número.'
  })[j.error] || ('Error del almacén: ' + j.error));
  return j;
}

/* una colección entera. Se queda guardada en el móvil: la próxima vez, si no ha cambiado, no se descarga */
async function traeCol(col){
  let cache = null;
  try{ cache = JSON.parse(lee('col_'+col) || 'null'); }catch(e){}
  const j = await api('col_lista', {col, firma: cache && cache.firma || ''}, 120000);
  if(j.igual && cache){ DATOS[col] = {items:cache.items, firma:cache.firma, listo:true}; return cache.items; }
  const out = [];
  (j.items || []).forEach(it => {
    if(it.borrado || !it.datos) return;
    let o; try{ o = JSON.parse(it.datos); }catch(e){ return; }
    if(!o) return;
    o.id = it.id; o._v = it.version || 0;
    out.push(o);
  });
  DATOS[col] = {items:out, firma:j.firma || '', listo:true};
  guarda('col_'+col, JSON.stringify({firma:j.firma || '', items:out}));
  if(col === 'inventario') INV_CACHE = null;
  return out;
}
/* guarda elementos de una colección sin pisar lo que haya cambiado otro (base = versión que conocíamos) */
async function guardaCol(col, objs, nombre){
  const items = objs.map(o => { const c = Object.assign({}, o); delete c._v;
    return {id:o.id, nombre:nombre(o), datos:JSON.stringify(c), base: o._v == null ? null : o._v}; });
  const j = await api('col_guardar', {col, items}, 90000);
  const res = j.res || [];

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const dOf = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const hoyISO = () => ymd(new Date());
const masDias = (iso, n) => { const d = dOf(iso); d.setDate(d.getDate() + n); return ymd(d); };
const nDias = (a, b) => { const x = dOf(a), y = dOf(b || a); return x && y ? Math.round((y - x) / 864e5) + 1 : 0; };
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const NUM_MES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const fechaCorta = iso => { const d = dOf(iso); return d ? d.getDate() + '/' + (d.getMonth()+1) : ''; };
const fechaLarga = iso => { const d = dOf(iso); return d ? d.getDate() + ' de ' + MES[d.getMonth()] + ' de ' + d.getFullYear() : ''; };
const fNum = iso => { const d = dOf(iso); return d ? String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear() : ''; };
/* el mismo texto que pone el selector de fechas del ordenador (formato automático) */
function fechasText(ini, fin){
  if(!ini) return '';
  if(!fin || fin === ini) return fNum(ini);
  const a = dOf(ini), b = dOf(fin);
  if(a.getFullYear() !== b.getFullYear()) return `del ${a.getDate()} de ${MES[a.getMonth()]} de ${a.getFullYear()} al ${b.getDate()} de ${MES[b.getMonth()]} de ${b.getFullYear()}`;
  if(a.getMonth() !== b.getMonth()) return `del ${a.getDate()} de ${MES[a.getMonth()]} al ${b.getDate()} de ${MES[b.getMonth()]} de ${b.getFullYear()}`;
  return `del ${a.getDate()} al ${b.getDate()} de ${MES[a.getMonth()]} de ${a.getFullYear()}`;
}
function tituloDia(iso){
  const h = hoyISO();
  if(iso === h) return 'Hoy';
  if(iso === masDias(h,1)) return 'Mañana';
  const d = dOf(iso); return DOW[d.getDay()][0].toUpperCase() + DOW[d.getDay()].slice(1);
}
const EST = {conf:['conf','Confirmado'], pend:['pend','Por confirmar'], anul:['anul','Anulado'], '':['pend','Sin estado']};
const estPill = e => { const [c,t] = EST[e || ''] || EST['']; return '<span class="pill ' + c + '">' + t + '</span>'; };

/* ============================================================
   STOCK: lo mismo que calcula el ordenador
   · cada trabajo del Planning ocupa su material de la entrega a la recogida
   · confirmado = firme · por confirmar = provisional · anulado no cuenta
   · libres = unidades − averiadas − lo que está fuera (el peor día) − lo que no ha vuelto
   ============================================================ */
const stNum = v => { const n = +String(v == null ? '' : v).replace(',', '.'); return isNaN(n) ? 0 : n; };
const stClean = v => { v = norm(v).replace(/\s*\(\d{1,3}\)\s*\.?$/, '');
  return (v === '-' || /^\?+$/.test(v)) ? '' : v.replace(/["'´`]/g,'').replace(/\s*x\s*/g,'x').replace(/[^a-z0-9x]+/g,' ').trim(); };
const stKey = it => it ? [it.nombre, it.marca, it.modelo, it.medidas].map(stClean).join('|') : '';
const jobSpan = j => { const a = [j.entrega, j.ini].filter(Boolean).sort()[0] || '', b = [j.recogida, j.fin || j.ini].filter(Boolean).sort().pop() || ''; return [a, b]; };
let INV_CACHE = null;
function inv(){
  if(INV_CACHE) return INV_CACHE;
  const items = DATOS.inventario.items, g = {}, of = {}, byId = {};
  items.forEach(it => { const k = stKey(it); (g[k] = g[k] || []).push(it); of[it.id] = k; byId[it.id] = it; });
  const idx = items.map(it => ({it, s:norm([it.nombre,it.marca,it.modelo,it.sub,it.cat,it.medidas,it.color,it.serie].join(' ')), n:norm(it.nombre)}));
  INV_CACHE = {g, of, byId, idx, jobs:null};
  return INV_CACHE;
}
function grupo(gk){
  const items = inv().g[gk] || [], conQ = items.filter(it => !(it.qty === '' || it.qty == null));
  return {items, it:items[0], qty: conQ.length ? conQ.reduce((s,it) => s + stNum(it.qty), 0) : null, av: items.reduce((s,it) => s + stNum(it.av), 0)};
}
function porGrupo(){
  const I = inv(); if(I.jobs) return I.jobs;
  const by = {};
  DATOS.planning.items.forEach(j => {
    if(j.estado === 'anul' || !(j.mat && j.mat.length)) return;
    const [a, b] = jobSpan(j); if(!a) return;
    const per = {}; j.mat.forEach(m => { if(!m.inv) return; const k = I.of[m.inv] || ('?' + m.inv); per[k] = (per[k] || 0) + stNum(m.cant); });
    Object.entries(per).forEach(([k, c]) => (by[k] = by[k] || []).push({j, cant:c, a, b: b || a, firme: j.estado === 'conf'}));
  });
  I.jobs = by; return by;
}
function devPend(gk){
  const I = inv(); let n = 0;
  DATOS.devoluciones.items.forEach(e => {
    if(e.kind !== 'job'){ if(e.estado === 'pend' && e.inv && I.of[e.inv] === gk) n += stNum(e.cant); }
    else if(e.rev) (e.lineas || []).forEach(l => { if(l.estado === 'pend' && l.inv && I.of[l.inv] === gk) n += stNum(l.falta); });
  });
  return n;
}
function libres(gk, a, b){
  const G = grupo(gk); b = b || a;
  const lista = (porGrupo()[gk] || []).filter(x => x.a <= b && x.b >= a);
  let firm = 0, tot = 0;
  if(lista.length){ for(let d = a; d <= b; d = masDias(d, 1)){ let f = 0, p = 0;
    lista.forEach(x => { if(x.a <= d && x.b >= d){ if(x.firme) f += x.cant; else p += x.cant; } });
    if(f > firm) firm = f; if(f + p > tot) tot = f + p; } }
  const dev = devPend(gk); firm += dev; tot += dev;
  return {G, qty:G.qty, av:G.av, firm, tot, dev, libres: G.qty == null ? null : G.qty - G.av - firm, libresTot: G.qty == null ? null : G.qty - G.av - tot, jobs:lista};
}
/* buscar en el inventario; devuelve grupos (lo que es igual cuenta junto) */
function buscaInv(q, limit = 40){
  const toks = norm(q).split(' ').filter(Boolean); if(!toks.length) return [];
  const I = inv(), res = [], vistos = new Set();
  I.idx.forEach(x => {
    if(!toks.every(t => x.s.includes(t))) return;
    let sc = 0; toks.forEach(t => { if(x.n.startsWith(t)) sc += 4; else if(x.n.includes(' ' + t)) sc += 2; if(x.s.includes(' ' + t) || x.s.startsWith(t)) sc += 1; });
    if(hasP(invPrice(x.it))) sc += 1.5;
    res.push([sc, x.it]);
  });
  res.sort((a, b) => b[0] - a[0]);
  const out = [];
  for(const [, it] of res){ const gk = I.of[it.id]; if(vistos.has(gk)) continue; vistos.add(gk); out.push({gk, it}); if(out.length >= limit) break; }
  return out;
}
/* pastilla de libres: necesita = cuántos quieres */
function pillLibres(L, necesita){
  if(L.qty == null) return '<span class="pill nd">sin unidades en el inventario</span>';
  const n = L.libres, p = L.libresTot;
  if(necesita){
    if(n < necesita) return '<span class="pill no">' + (n <= 0 ? 'no hay libres' : 'solo ' + n + ' libre' + (n === 1 ? '' : 's')) + '</span>';
    if(p < necesita) return '<span class="pill poco">' + n + ' libres, pero hay provisionales</span>';
    return '<span class="pill si">' + n + ' libre' + (n === 1 ? '' : 's') + '</span>';
  }
  return '';
}
const claseN = L => L.qty == null ? 'nd' : (L.libres <= 0 ? 'no' : (L.libresTot < L.libres || L.libresTot <= 0 ? 'poco' : 'si'));

/* ---------- PDF (con pdf-lib, que se carga solo cuando hace falta) ---------- */
function cargaPdfLib(){
  if(window.PDFLib) return Promise.resolve();
  return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'pdf-lib.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('No pude cargar el generador de PDF. ¿Tienes cobertura?')); document.head.appendChild(s); });
}
/* Helvetica solo sabe escribir los caracteres de Windows-1252: lo demás se cambia */
const W1252 = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
const pdfTxt = s => String(s ?? '').replace(/[→]/g, '->').split('').map(ch => { const c = ch.charCodeAt(0);
  return (c >= 32 && c <= 126) || (c >= 160 && c <= 255) || W1252.includes(ch) ? ch : (ch === '\n' ? '\n' : '?'); }).join('');
async function logoBytes(src){
  if(!src) return null;
  /* cualquier logo (png, jpg o svg) pasa por un lienzo y sale en PNG */
  return new Promise(ok => { const im = new Image(); im.onload = () => { try{
      const r = Math.min(1, 600 / Math.max(im.naturalWidth || 600, im.naturalHeight || 300)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round((im.naturalWidth || 600) * r)); c.height = Math.max(1, Math.round((im.naturalHeight || 300) * r));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => b ? b.arrayBuffer().then(a => ok({bytes:new Uint8Array(a), w:c.width, h:c.height})) : ok(null), 'image/png');
    }catch(e){ ok(null); } }; im.onerror = () => ok(null); im.src = src; });
}

      const ini = j.ini || '', fin = j.fin || ini;
      if(j.dias && j.dias.length ? j.dias.includes(d) : (ini && d >= ini && d <= fin)) lin.push({j, que:(ini === d || (j.dias && j.dias[0] === d) ? 'empieza' : (fin === d ? 'termina' : 'sigue'))});
      else if(j.entrega === d) lin.push({j, que:'entrega'});
      else if(j.recogida === d) lin.push({j, que:'recogida'});
    });
    if(!lin.length) return;
    algo = true;
    const dd = dOf(d);
    html += '<div class="dia' + (d === h ? ' hoy' : '') + '"><b>' + esc(tituloDia(d)) + '</b> ' + esc(dd.getDate() + ' ' + MES[dd.getMonth()].slice(0,3)) + '</div>';
    lin.forEach(({j, que}) => {
      if((que === 'sigue' || que === 'termina') && d !== h){
        html += '<button class="card fino" data-job="' + esc(j.id) + '"><div class="t">' + esc(j.concepto || '(sin concepto)') +
          ' <span class="sigue">' + (que === 'termina' ? 'último día' : 'sigue') + '</span></div></button>';
        return;
      }
      const meta = [];
      if(que === 'entrega') meta.push('<b>Entrega</b>' + (j.entregaH ? ' ' + esc(j.entregaH) : ''));
      if(que === 'recogida') meta.push('<b>Recogida</b>' + (j.recogidaH ? ' ' + esc(j.recogidaH) : ''));
      if(que !== 'entrega' && que !== 'recogida' && j.fin && j.fin !== j.ini) meta.push('<b>' + (que === 'empieza' ? 'hasta el ' + esc(fechaCorta(j.fin)) : 'del ' + esc(fechaCorta(j.ini)) + ' al ' + esc(fechaCorta(j.fin))) + '</b>');
      if(j.num) meta.push(esc(j.num));
      if(j.tipo) meta.push(esc(j.tipo));
      if((j.tecnicos || []).length) meta.push(esc(j.tecnicos.join(', ')));
      if(j.empresa) meta.push(esc(j.empresa));
      html += '<button class="card" data-job="' + esc(j.id) + '"><div class="t">' + esc(j.concepto || '(sin concepto)') + ' ' + estPill(j.estado) + '</div>' +
        (meta.length ? '<div class="m">' + meta.map(x => '<span>' + x + '</span>').join('') + '</div>' : '') + '</button>';
    });
  });
  host.innerHTML = algo ? html : '<p class="vacio">No hay nada en el Planning<br>de aquí al ' + esc(fechaCorta(dias[dias.length - 1])) + '.</p>';
}
function fichaJob(id){
  const j = DATOS.planning.items.find(x => x.id === id); if(!j) return;
  const f = [];
  const fechas = j.ini ? (j.fin && j.fin !== j.ini ? 'del ' + fechaCorta(j.ini) + ' al ' + fechaLarga(j.fin) : fechaLarga(j.ini)) : '';
  if(fechas) f.push(['Fechas', fechas]);
  if(j.num) f.push(['Nº presupuesto', j.num]);
  if(j.tipo) f.push(['Tipo', j.tipo]);
  if(j.entrega) f.push(['Entrega', fechaLarga(j.entrega) + (j.entregaH ? ' · ' + j.entregaH : '')]);
  if(j.recogida) f.push(['Recogida', fechaLarga(j.recogida) + (j.recogidaH ? ' · ' + j.recogidaH : '')]);
  if((j.tecnicos || []).length) f.push(['Técnicos', j.tecnicos.join(', ') + (j.tecConf ? '' : ' (sin confirmar)')]);
  if(j.transporte === true || j.empresa) f.push(['Transporte', (j.empresa || 'sí') + (j.traConf ? '' : ' (sin confirmar)')]);
  else if(j.transporte === false) f.push(['Transporte', 'no']);
  if(j.material === false) f.push(['Material', 'no sale material']);
  if(j.mat && j.mat.length) f.push(['Material', j.mat.map(m => m.cant + ' ' + (m.nombre || (inv().byId[m.inv] ? itemLabel(inv().byId[m.inv]) : '?'))).join('\n')]);
  if(j.obs) f.push(['Observaciones', j.obs]);
  abreHoja('<h2>' + esc(j.concepto || '(sin concepto)') + '</h2><div class="sub">' + estPill(j.estado) + '</div>' +
    '<dl class="dl">' + f.map(([a,b]) => '<dt>' + esc(a) + '</dt><dd style="white-space:pre-line">' + esc(b) + '</dd>').join('') + '</dl>' +
    '<div class="acciones"><button class="btn sec" data-cerrar>Cerrar</button></div>');
}

/* ============================================================
   COBROS (Libro)
   ============================================================ */
const lbLiq = id => DATOS.liquidaciones.items.find(l => (l.filas || []).some(f => f.id === id));
function lbV(row, k){
  if(row.man && k in row.man) return row.man[k];
  const a = row.a || {};
  if(k === 'bk'){ const bkl = a.bkl != null ? a.bkl : N0(a.bk) + N0(a.alq); return Math.round((bkl - N0(lbV(row,'alq'))) * 100) / 100; }
  return a[k] != null ? a[k] : (k === 'fac' ? '' : 0);
}
const lbBase = r => N0(lbV(r, 'base'));
function pintaCobros(){
  if(!DATOS.libro.listo) return;
  const L = DATOS.libro.items.slice().sort((a,b) => (b.y - a.y) || (b.m - a.m) || String(a.num).localeCompare(String(b.num)));
  const pend = L.filter(r => !r.cob), cobr = L.filter(r => r.cob);
  $('#totPend').textContent = eur0(pend.reduce((s,r) => s + lbBase(r), 0));
  $('#totSin').textContent  = eur0(cobr.filter(r => !lbLiq(r.id)).reduce((s,r) => s + lbBase(r), 0));
  const lista = FILTRO === 'pend' ? pend : cobr, host = $('#cobLista');
  if(!lista.length){ host.innerHTML = '<p class="vacio">' + (FILTRO === 'pend' ? 'Nada pendiente de cobro.<br>Bien ahí.' : 'Todavía no hay bolos cobrados.') + '</p>'; return; }
  let html = '', mesAct = '';
  lista.forEach(r => {
    const mk = r.y + '-' + r.m;
    if(mk !== mesAct){ mesAct = mk; const nm = MES[Math.max(0, Math.min(11, N0(r.m)))] || '';
      html += '<div class="dia"><b>' + esc(nm[0].toUpperCase() + nm.slice(1)) + ' ' + esc(r.y) + '</b></div>'; }
    const liq = lbLiq(r.id), fac = lbV(r, 'fac'), meta = [];
    if(fac) meta.push(esc(fac));
    if(r.cob) meta.push('<b>Cobrado</b> ' + esc(fechaCorta(r.cob)));
    if(liq) meta.push('<span class="pill ent">' + esc(liq.n) + 'ª liquidación</span>');
    html += '<button class="card" data-fila="' + esc(r.id) + '"><div class="t">' + esc(r.num || '?') + ' <span class="imp">' + eur(lbBase(r)) + '</span></div>' +
      '<div class="m"><span>' + esc(r.cli || '(sin empresa)') + '</span>' + meta.map(x => '<span>' + x + '</span>').join('') + '</div></button>';
  });
  host.innerHTML = html;
}
function fichaFila(id){
  const r = DATOS.libro.items.find(x => x.id === id); if(!r) return;
  const liq = lbLiq(r.id);
  const f = [['Factura', lbV(r,'fac') || '—'], ['Total sin IVA', eur(lbBase(r))],
    ['Gastos', eur(['alq','luis','itu','otros','tra','comp'].reduce((s,k) => s + N0(lbV(r,k)), 0))], ['Cobrado', r.cob ? fechaLarga(r.cob) : 'todavía no']];
  let acc;
  if(liq) acc = '<div class="nota">Este bolo está en la ' + esc(liq.n) + 'ª liquidación de ' + esc(liq.y) + ', que está congelada. Para cambiarlo hay que deshacerla desde el ordenador.</div>' +
    '<div class="acciones"><button class="btn sec" data-cerrar>Cerrar</button></div>';
  else if(r.cob) acc = '<div class="acciones"><button class="btn sec" data-descobrar="' + esc(r.id) + '">Quitar el cobro</button><button class="btn sec" data-cerrar>Cerrar</button></div>';
  else acc = '<label for="fCob">Fecha de cobro</label><input type="date" id="fCob" value="' + hoyISO() + '">' +
    '<div class="acciones"><button class="btn ok" data-cobrar="' + esc(r.id) + '">Marcar cobrado</button><button class="btn sec" data-cerrar>Cerrar</button></div>';
  abreHoja('<h2>' + esc(r.num || '?') + '</h2><div class="sub">' + esc(r.cli || '') + '</div>' +
    '<dl class="dl">' + f.map(([a,b]) => '<dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd>').join('') + '</dl>' + acc);
}
async function guardaFila(r, boton){
  const txt = boton.textContent; boton.disabled = true; boton.textContent = 'Guardando…';
  try{
    const res = await guardaCol('libro', [r], o => (o.num || '?') + (o.cli ? ' · ' + o.cli : ''));
    if(res.conflicto){ await traeCol('libro'); pintaCobros(); throw new Error('Alguien ha cambiado esta fila desde el ordenador. La he vuelto a leer: míralo y hazlo otra vez.'); }
    cierraHoja(); pintaCobros();
  }catch(e){ boton.disabled = false; boton.textContent = txt; $('#cobAviso').textContent = e.message; cierraHoja(); }
}

/* ---------- panel de abajo ---------- */
function abreHoja(html, alta){ const h = $('#hoja'); h.className = 'hoja' + (alta ? ' alta' : ''); h.innerHTML = html; $('#velo').hidden = false; }
function cierraHoja(){ $('#velo').hidden = true; $('#hoja').innerHTML = ''; }
$('#velo').addEventListener('click', e => { if(e.target === $('#velo')) cierraHoja(); });

/* ---------- entrar y salir ---------- */
function sesionVisible(dentro){
  $$('.sesion').forEach(e => { e.hidden = !dentro; });
  $('#tabs').hidden = !dentro;
  $('#hQuien').textContent = USUARIO;
  muestra(dentro ? VISTA : 'Login');
}
function muestra(v){
  if(v !== 'Login') VISTA = v;
  $$('.vista').forEach(s => s.classList.toggle('on', s.id === 'v' + v));
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('main').scrollTop = 0;
}
function salir(caducada){
  TOKEN = ''; USUARIO = '';
  guarda('token', null); guarda('usuario', null);
  COLS.forEach(c => { DATOS[c] = {items:[], firma:'', listo:false}; guarda('col_' + c, null); });
  INV_CACHE = null;
  sesionVisible(false);
  $('#loginAviso').textContent = caducada ? 'Tu sesión ha caducado. Entra otra vez.' : '';
}
$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#bEntrar'), u = $('#usuario').value.trim(), c = $('#clave').value;
  if(!u || !c) return;
  $('#loginAviso').textContent = ''; b.disabled = true; b.textContent = 'Entrando…';
  try{
    const j = await api('login', {usuario:u, clave:c}, 45000);
    TOKEN = j.token; USUARIO = j.usuario; guarda('token', TOKEN); guarda('usuario', USUARIO);
    $('#clave').value = ''; sesionVisible(true); recarga();
  }catch(err){ $('#loginAviso').textContent = err.message; }
  finally{ b.disabled = false; b.textContent = 'Entrar'; }
});
$('#bSalir').addEventListener('click', () => {
  abreHoja('<h2>¿Salir de Backline móvil?</h2><div class="sub">Para volver tendrás que poner otra vez usuario y contraseña.</div>' +
    '<div class="acciones"><button class="btn" data-act="salirSi">Salir</button><button class="btn sec" data-cerrar>Quedarme</button></div>');
});
$('#bRecargar').addEventListener('click', () => recarga());

/* ---------- cargar todo ---------- */
let cargando = false;
async function recarga(){
  if(cargando) return; cargando = true;
  const b = $('#bRecargar'); b.textContent = '…';
  ['semAviso','cobAviso','liAviso','prAviso'].forEach(id => $('#' + id).textContent = '');
  const paso = async (cols, pinta, aviso, falla) => {
    try{ for(const c of cols) await traeCol(c); INV_CACHE && (INV_CACHE.jobs = null); pinta(); }
    catch(e){ $('#' + aviso).textContent = e.message; if(falla) falla(); }
  };
  /* primero lo ligero; luego inventario y compañía */
  await paso(['planning'], pintaSemana, 'semAviso', () => $('#semLista').innerHTML = '<p class="vacio">No he podido leer el Planning.</p>');
  await paso(['ajustes','clientes','inventario','devoluciones'], () => { pintaPresu(); pintaLibre(); }, 'prAviso',
    () => { $('#liAviso').textContent = $('#prAviso').textContent; });
  await paso(['libro','liquidaciones'], pintaCobros, 'cobAviso', () => $('#cobLista').innerHTML = '<p class="vacio">No he podido leer el libro.</p>');
  b.textContent = '↻'; cargando = false;
}

/* ---------- escribir en los campos ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'liBusca' || t.id === 'liDesde' || t.id === 'liHasta'){ pintaLibre(); return; }
  if(t.id === 'maBusca'){ pintaMaterial(); return; }
  if(t.id === 'prCli'){ P.cliTxt = t.value; presuGuarda(); pintaSugCli(); return; }
  if(t.dataset.p){
    const k = t.dataset.p;
    if(k === 'ini' || k === 'fin'){
      const antes = diasP(); P[k] = t.value;
      if(P.ini && P.fin && P.fin < P.ini) P.fin = P.ini;
      if(k === 'ini' && !P.fin) P.fin = P.ini;
      const ahora = diasP();
      SECS.forEach(([s]) => P.secs[s].forEach(l => { if(N0(l.dias) === antes) l.dias = ahora; }));   /* las líneas que iban con todos los días, siguen con todos */
      presuGuarda(); pintaPresu(); return;
    }
    P[k] = t.value; presuGuarda(); return;
  }
  if(t.dataset.l){
    const w = t.closest('.lin'), l = P.secs[w.dataset.s][+w.dataset.i], k = t.dataset.l;
    l[k] = k === 'concepto' ? t.value : (t.value.trim() === '' ? '' : t.value.replace(',', '.'));
    presuGuarda();
    const im = w.querySelector('[data-imp]'); if(im) im.textContent = eur(lineImp(l));
    pintaTotales(); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'prCon'){ const cs = (P.cli.contactos || []).filter(k => k.nombre); P.con = cs[+t.value] || null; presuGuarda(); return; }
  if(t.dataset && t.dataset.l === 'cant'){ pintaPresu(); }   /* al cambiar la cantidad se recalcula el aviso de stock */
});

/* ---------- toques ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('#tabs button'); if(nav){ muestra(nav.dataset.v); return; }
  const fil = t.closest('#cobFiltros button'); if(fil){ FILTRO = fil.dataset.f; $$('#cobFiltros button').forEach(x => x.classList.toggle('on', x === fil)); pintaCobros(); return; }
  if(t.closest('[data-cerrar]')){ cierraHoja(); return; }
  const g = t.closest('[data-gk]'); if(g){ fichaGrupo(g.dataset.gk); return; }
  const job = t.closest('[data-job]'); if(job){ fichaJob(job.dataset.job); return; }
  const fila = t.closest('[data-fila]'); if(fila){ fichaFila(fila.dataset.fila); return; }
  const cli = t.closest('[data-cli]'); if(cli){ eligeCliente(cli.dataset.cli); return; }
  const ai = t.closest('[data-addinv]'); if(ai){ anadeMaterial(ai.dataset.addinv); return; }
  const cb = t.closest('[data-cobrar]');
  if(cb){ const r = DATOS.libro.items.find(x => x.id === cb.dataset.cobrar); if(r){ r.cob = $('#fCob').value || hoyISO(); guardaFila(r, cb); } return; }
  const dc = t.closest('[data-descobrar]');
  if(dc){ const r = DATOS.libro.items.find(x => x.id === dc.dataset.descobrar); if(r){ r.cob = ''; guardaFila(r, dc); } return; }
  const a = t.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act === 'salirSi'){ cierraHoja(); salir(false); }
  else if(act === 'sinCli'){ P.cli = null; P.con = null; presuGuarda(); pintaPresu(); }
  else if(act === 'material') abreMaterial();
  else if(act === 'linea'){ P.secs[a.dataset.s].push({id:uid(), concepto:'', pvp:'', cant:1, dias:diasP(), dto:''}); presuGuarda(); pintaPresu();
    const ws = $$('.lin[data-s="' + a.dataset.s + '"]'); const w = ws[ws.length - 1]; if(w){ const i = w.querySelector('input'); i.focus(); w.scrollIntoView({block:'center'}); } }
  else if(act === 'quita'){ const w = a.closest('.lin'); P.secs[w.dataset.s].splice(+w.dataset.i, 1); presuGuarda(); pintaPresu(); }
  else if(act === 'guardar') preguntaGuardar();
  else if(act === 'guardarSi') guardar(a);
  else if(act === 'borrar'){
    abreHoja('<h2>¿Empezar de nuevo?</h2><div class="sub">Se borra lo que llevas de este presupuesto. Lo que ya esté guardado en el almacén no se toca.</div>' +
      '<div class="acciones"><button class="btn" data-act="nuevo">Borrar y empezar</button><button class="btn sec" data-cerrar>Seguir con este</button></div>');
  }
  else if(act === 'nuevo'){ cierraHoja(); P = presuNuevo(); presuGuarda(); $('#prAviso').textContent = ''; pintaPresu(); $('main').scrollTop = 0; }
  else if(act === 'pdf') mandaPdf(a);
});

/* ---------- arranque ---------- */
presuCarga();
$('#liDesde').value = hoyISO(); $('#liHasta').value = hoyISO();
if(TOKEN){ sesionVisible(true); recarga(); } else sesionVisible(false);
window.addEventListener('pageshow', e => { if(e.persisted && TOKEN) recarga(); });
</script>
</body>
</html>
